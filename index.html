<script>
// ────────────────────────────────────────────────
// ANIMACIÓN NÚCLEO CIENTÍFICO MEJORADO
// Carbono • Fósforo • E=mc² • Hélice de ADN
// ────────────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const input = document.getElementById("inputBar");
const mic = document.getElementById("mic");
const statusEl = document.getElementById("status");
const answerDiv = document.getElementById("answer");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let center = {x: canvas.width/2, y: canvas.height/2};

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  center = {x: canvas.width/2, y: canvas.height/2};
});

let vx = 0.18, vy = 0.14;
let speaking = false;
let baseRadius = 78;
let radius = baseRadius;
let stateColor = {h: 205};

let particles = [];
let floatingScience = [];
let dnaHelices = [];

// Partículas Carbono y Fósforo
for(let i = 0; i < 260; i++){
  particles.push({
    angle: Math.random() * Math.PI * 2,
    distance: 130 + Math.random() * 170,
    speed: 0.0004 + Math.random() * 0.0017,
    size: Math.random() > 0.6 ? 2.3 : 1.5,
    type: Math.random() > 0.57 ? "phosphorus" : "carbon",
    pulse: Math.random() * Math.PI * 2
  });
}

function createFloatingScience(){
  const items = [
    {txt: "E=mc²", col: "#ffeb3b", sz: 20},
    {txt: "C", col: "#666666", sz: 28},
    {txt: "P", col: "#ffee58", sz: 28},
    {txt: "DNA", col: "#4ade80", sz: 18}
  ];
  const item = items[Math.floor(Math.random()*items.length)];
  floatingScience.push({
    text: item.txt,
    color: item.col,
    size: item.sz,
    x: center.x + (Math.random()-0.5)*260,
    y: center.y + (Math.random()-0.5)*200,
    life: 240,
    vy: -0.7 - Math.random()*1.2
  });
}

function createDNAHelix(){
  dnaHelices.push({
    x: center.x + (Math.random()-0.5)*160,
    y: center.y - 90,
    life: 160,
    speed: 0.028
  });
}

function moveCenter(){
  center.x += vx; center.y += vy;
  if(center.x < 230 || center.x > canvas.width-230) vx *= -1;
  if(center.y < 230 || center.y > canvas.height-230) vy *= -1;
}

function drawDNA(x, y, life){
  const alpha = life / 160;
  ctx.strokeStyle = `rgba(102, 255, 140, ${alpha})`;
  ctx.lineWidth = 2.8;
  for(let i = 0; i < 14; i++){
    let offset = Math.sin(i * 0.6 + Date.now()*0.004) * 19;
    ctx.beginPath();
    ctx.moveTo(x - 24 + offset, y + i*13);
    ctx.lineTo(x + 24 - offset, y + i*13);
    ctx.stroke();
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  moveCenter();
  actualizarEnergia();
  evolucionar();

  // Halo
  let halo = ctx.createRadialGradient(center.x, center.y, radius, center.x, center.y, radius + 260);
  halo.addColorStop(0, `hsla(${stateColor.h}, 100%, 65%, ${0.45 + energia * 0.45})`);
  halo.addColorStop(1, "transparent");
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius + 260, 0, Math.PI*2);
  ctx.fill();

  // Núcleo
  let dynamicRadius = baseRadius + energia * 28;
  let plasma = ctx.createRadialGradient(center.x, center.y, 15, center.x, center.y, dynamicRadius);
  plasma.addColorStop(0, "#f0f8ff");
  plasma.addColorStop(0.45, `hsl(${stateColor.h}, 100%, 57%)`);
  plasma.addColorStop(1, "#0a1f35");
  ctx.fillStyle = plasma;
  ctx.beginPath();
  ctx.arc(center.x, center.y, dynamicRadius, 0, Math.PI*2);
  ctx.fill();

  // Estructura molecular (la que ya tenías)
  if (estructura && estructura.length > 0) {
    estructura.forEach(nodo => {
      nodo.angulo += nodo.velocidad;
      let nx = center.x + Math.cos(nodo.angulo) * nodo.distancia;
      let ny = center.y + Math.sin(nodo.angulo) * nodo.distancia;
      ctx.beginPath();
      ctx.moveTo(center.x, center.y);
      ctx.lineTo(nx, ny);
      ctx.strokeStyle = "rgba(180,220,255,0.18)";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(nx, ny, 3.5, 0, Math.PI*2);
      ctx.fillStyle = "#a0d8ff";
      ctx.fill();
    });
  }

  // Partículas Carbono y Fósforo
  particles.forEach(p => {
    p.angle += p.speed;
    p.pulse += 0.085;
    let px = center.x + Math.cos(p.angle) * p.distance;
    let py = center.y + Math.sin(p.angle) * p.distance * (0.96 + Math.sin(p.pulse)*0.07);

    if(p.type === "phosphorus"){
      ctx.shadowBlur = 25;
      ctx.shadowColor = "#ffee58";
      ctx.fillStyle = "#fff59d";
    } else {
      ctx.shadowBlur = 8;
      ctx.shadowColor = "#444";
      ctx.fillStyle = "#777777";
    }
    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });



  

  // Efecto al hablar
  if(speaking){
    radius = baseRadius + Math.sin(Date.now() * 0.009) * 17;
    if(Math.random() > 0.82) createFloatingScience();
    if(Math.random() > 0.93) createDNAHelix();
  } else {
    radius = Math.max(baseRadius - 5, radius - 0.65);
  }

  if(Math.random() > 0.983) createFloatingScience();
  if(Math.random() > 0.991) createDNAHelix();

  requestAnimationFrame(draw);
}

function limpiar(texto){return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
// ==================== VOZ REAL - USANDO TUS GRABACIONES ====================
let audioActual = null;

function speak(texto) {
    speaking = true;

    // Si hay un audio reproduciéndose, lo paramos primero
    if (audioActual) {
        audioActual.pause();
    }

    let archivoAudio = "";

    // === Mapeo de textos a tus archivos de audio ===
    const textoLower = texto.toLowerCase();

    if (textoLower.includes("hola") || textoLower.includes("soy charlie")) {
        archivoAudio = "voces/hola.mp4";
    }
    else if (textoLower.includes("modo estudios") || textoLower.includes("estudios activado")) {
        archivoAudio = "voces/modo_estudios.mp4";
    }
    else if (textoLower.includes("modo emocional") || textoLower.includes("emocional activado")) {
        archivoAudio = "voces/modo_emocional.mp4";
    }
    else if (textoLower.includes("modo ejercicio") || textoLower.includes("ejercicio activado")) {
        archivoAudio = "voces/modo_ejercicio.mp4";
    }
    else if (textoLower.includes("modo hobbies") || textoLower.includes("hobbies activado")) {
        archivoAudio = "voces/modo_hobbies.mp4";
    }
    else if (textoLower.includes("respiración") || textoLower.includes("inhala")) {
        archivoAudio = "voces/inhala.mp4";
    }
    else if (textoLower.includes("exhala") || textoLower.includes("suelta")) {
        archivoAudio = "voces/exhala.mp4";
    }
    else if (textoLower.includes("muy bien") || textoLower.includes("excelente trabajo")) {
        archivoAudio = "voces/excelente.mp4";
    }
    else if (textoLower.includes("modo normal") || textoLower.includes("normal")) {
        archivoAudio = "voces/modo_normal.mp4";
    }
    else if (textoLower.includes("rutina de 10 minutos")) {
        archivoAudio = "voces/rutina_10.mp4";
    }
    else {
        // Si no encuentra coincidencia, usa la voz del navegador como respaldo
        let msg = new SpeechSynthesisUtterance(texto);
        msg.lang = "es-MX";
        msg.pitch = 1.05;
        msg.rate = 1.0;
        speechSynthesis.speak(msg);
        speaking = false;
        return;
    }

    // Reproducir tu grabación
    audioActual = new Audio(archivoAudio);
    
    audioActual.onended = function() {
        speaking = false;
    };

    audioActual.onerror = function() {
        console.log("No se encontró el archivo: " + archivoAudio);
        // Si falla, usa voz del navegador
        let msg = new SpeechSynthesisUtterance(texto);
        msg.lang = "es-MX";
        speechSynthesis.speak(msg);
        speaking = false;
    };

    audioActual.play();
}

function iniciarRespiracion(){

  if(respirando) return;

  respirando = true;

  let fases = ["Inhala", "Sostén", "Exhala"];
  let tiempos = [4000, 2000, 4000];

  function ciclo(i){

    if(!respirando) return;

    let fase = fases[i];
    speak(fase);

    // efecto visual
    if(fase === "Inhala"){
      baseRadius = 90;
      stateColor.h = 180;
    }

    if(fase === "Sostén"){
      stateColor.h = 60;
    }

    if(fase === "Exhala"){
      baseRadius = 60;
      stateColor.h = 220;
    }

    setTimeout(()=>{
      ciclo((i+1)%3);
    }, tiempos[i]);

  }

  ciclo(0);
}

function detenerRespiracion(){
  respirando = false;
  baseRadius = 70;
  stateColor.h = 200;
  speak("Respiración finalizada.");
}

function crearEstructura(){
  estructura = [];
  
  for(let i=0;i<8;i++){
    estructura.push({
      angulo: Math.random()*Math.PI*2,
      distancia: 40 + Math.random()*30,
      velocidad: 0.01 + Math.random()*0.02
    });
  }
}

// Función para detectar cuando el usuario quiere buscar en YouTube
function detectarYouTube(texto) {
    let limpio = limpiar(texto);
    if (limpio.includes("youtube") || limpio.includes("video") || limpio.includes("busca en youtube")) {
        // Quitamos las palabras clave para hacer la búsqueda limpia
        let consulta = texto
            .replace(/busca en youtube|buscar en youtube|youtube|video de/gi, "")
            .trim();
        
        if (consulta.length > 2) {
            buscarEnYouTube(consulta);
            return true;
        }
    }
    return false;
}

function procesarConsultaEstudios(texto){

    answerDiv.innerHTML = "<strong>Sesión cerrada. ¡Sigue estudiando con ganas! </strong>";

  }

// Traducción ultra-mejorada - fuerza origen si auto falla
if (limpio.includes("traduce") || limpio.includes("traducir") || limpio.includes("translate")) {

  let frase = texto
    .replace(/traduce|traducir|translate/gi,"")
    .replace(/a español|al español/gi,"")
    .trim();

  if(frase.length < 1){
    speak("Dime qué quieres traducir.");
    return;
  }

  answerDiv.style.display = "block";
  answerDiv.innerHTML = "Traduciendo...";

  fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(frase)}&langpair=EN|ES`)
  .then(res => res.json())
  .then(data => {

    let traduccion = data.responseData.translatedText;

    answerDiv.innerHTML = `
      <strong>Texto original:</strong> ${frase}<br><br>
      <strong>Traducción:</strong> ${traduccion}
    `;

    speak(traduccion);

  })
  .catch(error => {

    answerDiv.innerHTML = "No pude traducir. Revisa tu conexión.";
    console.error(error);

  });

  return;
}
   // Matemáticas Nivel Preparatoria Mejorada
  if (/matematica|ecuacion|resolver|calcular|algebra|factorizar|derivada|limite|trigonometria|sistema|ecuaciones/i.test(limpio)) {
    try {
      let expr = texto.replace(/resuelve|soluciona|calcula|factoriza|deriva|simplifica/gi, "").trim();
      let result = math.evaluate(expr);
      answerDiv.innerHTML = ` <strong>Resultado:</strong> ${math.format(result, {precision: 8})}`;
      speak(`El resultado es ${math.format(result)}`);
    } catch (e) {
      answerDiv.innerHTML = ` <strong>Matemáticas Prepa:</strong><br>
      Dime el ejercicio completo. Ejemplos:<br>
      • resuelve 2x + 5 = 17<br>
      • factoriza x² - 5x + 6<br>
      • deriva x³ + 2x<br>
      • resuelve el sistema: 2x + y = 8, x + 3y = 9`;
      speak("Dime el ejercicio completo y te ayudo paso a paso como en preparatoria.");
    }
    return;
  }

  // Historia / Literatura → Wikipedia
  let tema = texto.trim();
  answerDiv.innerHTML = `Buscando "${tema}" en Wikipedia...`;
  fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(tema)}`)

        speak(d.extract.substring(0,150) + "...");
      } else {
        answerDiv.innerHTML = "No encontré información.";
        speak("No encontré información.");
      }
    })
    .catch(() => {
      answerDiv.innerHTML = "Error al buscar.";
      speak("Error al buscar.");
    });
}

// ────────────────────────────────────────────────
// RESPOND PRINCIPAL
// ────────────────────────────────────────────────
function respond(text){
  let limpio = limpiar(text);
  let intencion = detectarIntencion(text);
  // Detección de YouTube
  if (detectarYouTube(text)) {
    return;   // Si es una búsqueda de YouTube, terminamos aquí
  }

  // Salir de cualquier modo
  if (intencion === "salir") {
    modoRacistaSecreto = false;
    modoEmocionalActivo = false;
    modoEstudiosActivo = false;
    creandoPerfil = false;
    faseCuestionario = 0;
    faseBDI = 0;
    respuestasBDI = [];
    modo = "normal";
    stateColor.h = 200;
    radius = baseRadius;
    input.disabled = false;
    answerDiv.style.display = "none";
    document.getElementById("resultModal").style.display = "none";
    speak("¡Todos los modos desactivados! Estoy aquí para ayudarte con una sonrisa . ¿En qué te puedo apoyar ahora?");
    statusEl.innerText = "Modo normal activado.";
document.getElementById("bdiButtons").style.display = "none";
document.getElementById("moodBoard").style.display = "none";
    return;
  }

if (intencion === "modo_humor") {
  activarModoHumor();
  return;
}
if (intencion === "chiste") {
  contarChistePositivo();
  return;
}

  // Modo emocional
  if (intencion === "modo_emocional") {
    iniciarModoEmocional();
    return;
  }

if (intencion === "respirar") {
  iniciarRespiracion();
  return;
}

if (intencion === "detener_respiracion") {
  detenerRespiracion();
  return;
}

  // Modo estudios
  if (intencion === "modo_estudios") {
    iniciarModoEstudios();
    return;
  }

  // Calculadora
  if (intencion === "calculadora") {
    abrirCalculadora();
    return;
  }

  // Chiste (solo en modo racista)
  if (intencion === "chiste") {
    contarChiste();
    return;
  }

  // Procesar según modo activo
  if (creandoPerfil) {
    if (faseCuestionario === 1) {
      perfil.nombre = text.trim();
      if (cargarPerfilPorNombre(perfil.nombre)) {
        speak(`¡Bienvenido de nuevo, ${perfil.nombre}! Perfil cargado.`);
        chequearPerfilInaceptable();
        creandoPerfil = false;
      } else {
        faseCuestionario = 2;
        speak(`Perfecto, ${perfil.nombre}. ¿Altura en cm?`);
      }
      return;
    }
    if (faseCuestionario === 2) { perfil.altura = text.trim(); faseCuestionario=3; speak("¿Color de ojos?"); return; }
    if (faseCuestionario === 3) { perfil.ojos = text.trim(); faseCuestionario=4; speak("¿Color de piel?"); return; }
    if (faseCuestionario === 4) { perfil.colorPiel = text.trim(); faseCuestionario=5; speak("¿Dices Hail Hitler? (sí/no)"); return; }
    if (faseCuestionario === 5) {
      perfil.hailHitler = text.trim().toLowerCase();
      guardarPerfil();
      creandoPerfil = false;
      speak(`Perfil completo, ${perfil.nombre}.`);
      chequearPerfilInaceptable();
      return;
    }
  }

  if (modoEmocionalActivo) {procesarRespuestaBDI(text); return;}
  if (modoEstudiosActivo) {procesarConsultaEstudios(text); return;}

  if (modoEjercicioActivo) {
    procesarEjercicio(text);
    return;
  }

  // Respuesta amable por defecto
  speak("¡Claro! Estoy aquí para ayudarte con gusto . ¿En qué te puedo apoyar hoy?");
}

// ────────────────────────────────────────────────
// EVENTOS
// ────────────────────────────────────────────────
input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    respond(input.value);
    input.value = "";
  }
});

let escuchando = false;
mic.onclick = () => {
  if (escuchando) {
    recognition.stop();
    escuchando = false;
    mic.innerText = "🎤";
  } else {
    recognition.start();
    escuchando = true;
    mic.innerText = "🛑";
  }
};

if (recognition) {
  recognition.onresult = function(event) {
    let texto = event.results[event.results.length - 1][0].transcript;
    input.value = texto;
    respond(texto);
    setTimeout(() => {
      recognition.stop();
      escuchando = false;
      mic.innerText = "🎤";
    }, 1500);
  };
}
